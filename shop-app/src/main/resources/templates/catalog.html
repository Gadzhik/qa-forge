<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/layout :: head('Каталог')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1>Меню</h1>
    <form method="get" action="/" th:class="${v2} ? 'filters filters--v2' : 'filters'" data-testid="filters">
        <input type="search" name="search" th:value="${search}" placeholder="Поиск по меню"
               th:id="${v2} ? 'q' : 'search-input'" data-testid="search-input">
        <select name="category" th:id="${v2} ? 'cat' : 'category-select'" data-testid="category-select">
            <option value="">Все категории</option>
            <option th:each="c : ${categories}" th:value="${c}" th:text="${c.title()}"
                    th:selected="${c == category}"></option>
        </select>
        <select name="sort" data-testid="sort-select">
            <option value="">По умолчанию</option>
            <option value="price,asc" th:selected="${sort == 'price,asc'}">Сначала дешёвые</option>
            <option value="price,desc" th:selected="${sort == 'price,desc'}">Сначала дорогие</option>
            <option value="name,asc" th:selected="${sort == 'name,asc'}">По названию</option>
        </select>
        <button type="submit" th:class="${v2} ? 'btn-v2' : 'btn'" data-testid="search-button">Найти</button>
    </form>

    <p th:if="${#lists.isEmpty(products)}" class="empty" data-testid="empty-result">Ничего не найдено</p>

    <!-- Дизайн v1: сетка карточек -->
    <div th:unless="${v2}" class="grid" data-testid="product-list">
        <div th:each="p : ${products}" class="product-card" data-testid="product-card" th:attr="data-product-id=${p.id}">
            <div class="emoji" th:text="${p.emoji}">🍔</div>
            <h3><a th:href="@{/product/{id}(id=${p.id})}" class="product-name" data-testid="product-name" th:text="${p.name}">Бургер</a></h3>
            <p class="product-desc" th:text="${p.description}"></p>
            <div class="price" data-testid="product-price" th:text="${p.price} + ' ₽'">289.90 ₽</div>
            <form action="/cart/add" method="post">
                <input type="hidden" name="productId" th:value="${p.id}">
                <button type="submit" class="btn btn-add" th:id="'add-' + ${p.id}" data-testid="add-to-cart">В корзину</button>
            </form>
        </div>
    </div>

    <!-- Дизайн v2: список строк, другие классы и id, порядок элементов изменён -->
    <ul th:if="${v2}" class="menu-list" data-testid="product-list">
        <li th:each="p : ${products}" class="tile" data-testid="product-card" th:attr="data-product-id=${p.id}">
            <span class="tile__price" data-testid="product-price" th:text="${p.price} + ' ₽'"></span>
            <span class="tile__emoji" th:text="${p.emoji}"></span>
            <a th:href="@{/product/{id}(id=${p.id})}" class="tile__title" data-testid="product-name" th:text="${p.name}"></a>
            <form action="/cart/add" method="post" class="tile__form">
                <input type="hidden" name="productId" th:value="${p.id}">
                <button type="submit" class="cta" data-testid="add-to-cart">+ Добавить</button>
            </form>
        </li>
    </ul>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
