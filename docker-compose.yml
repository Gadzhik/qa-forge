# Инфраструктура для модулей 11–15 (базы данных, Kafka, CI).
#
#   docker compose up -d postgres kafka kafka-ui   — только инфраструктура (QA Burger запускаете сами с профилем docker)
#   docker compose up -d --build                   — всё сразу, включая QA Burger в контейнере
#   docker compose down                            — остановить
#   docker compose down -v                         — остановить и удалить данные
#
# Подробно каждая строка разобрана в уроке 15.2 «Docker Compose».
services:
  postgres:
    image: postgres:16-alpine            # официальный образ PostgreSQL 16 (alpine = маленький)
    container_name: qaburger-postgres
    environment:                         # переменные, которыми образ создаёт базу и пользователя
      POSTGRES_DB: qaburger
      POSTGRES_USER: qaburger
      POSTGRES_PASSWORD: qaburger
    ports:
      # порт_на_вашем_компьютере:порт_в_контейнере. Если 5432 занят (у вас уже есть PostgreSQL),
      # задайте другой: QABURGER_DB_PORT=55432 docker compose up -d postgres
      - "${QABURGER_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  # данные переживают перезапуск контейнера
    healthcheck:                         # как Docker поймёт, что база готова
      test: ["CMD-SHELL", "pg_isready -U qaburger -d qaburger"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1            # официальный образ Kafka (режим KRaft, без ZooKeeper)
    container_name: qaburger-kafka
    ports:
      - "${QABURGER_KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      # Как к брокеру обращаться: с вашего компьютера — localhost:9092, из других контейнеров — kafka:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${QABURGER_KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2 # веб-интерфейс для просмотра топиков и сообщений
    container_name: qaburger-kafka-ui
    ports:
      - "8090:8080"                      # http://localhost:8090
    environment:
      KAFKA_CLUSTERS_0_NAME: qaburger
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  shop-app:
    build: ./shop-app                    # образ собирается из shop-app/Dockerfile
    container_name: qaburger-app
    profiles: ["app"]                    # запускается только с --profile app (или явным указанием сервиса)
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker     # PostgreSQL + Kafka вместо H2 и событий в памяти
      DB_HOST: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  pgdata:
