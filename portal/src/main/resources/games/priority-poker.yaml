# Priority Poker: severity (Blocker, Critical, Major, Minor, Trivial) и priority (High, Medium, Low).
# Оценки — типичные для интернет-магазина; в реальной команде их обсуждают с продуктом.
rounds:
  - title: Оплата картой всегда возвращает ошибку
    description: После нажатия «Оплатить» любой картой появляется «Платёж отклонён». Другие способы оплаты на сайте отсутствуют. Продакшен, вечер пятницы.
    severity: Blocker
    priority: High
    explain: Магазин не может принимать деньги — основная бизнес-функция полностью недоступна, обходного пути нет. Чинят немедленно.
  - title: Опечатка в названии компании в шапке сайта
    description: На всех страницах в логотипе написано «QA Bruger» вместо «QA Burger». Функциональность не затронута.
    severity: Trivial
    priority: High
    explain: Технически пустяк, но это лицо бренда, видное каждому посетителю. Классический пример «низкая severity — высокий priority».
  - title: Падение раздела «Архив заказов за 2015 год»
    description: При открытии архива заказов старше 5 лет страница отвечает 500. Разделом пользовались 3 человека за последний год.
    severity: Critical
    priority: Low
    explain: Сама страница полностью неработоспособна (500), но её почти никто не открывает, а данные доступны через поддержку. «Высокая severity — низкий priority».
  - title: Скидка по промокоду считается дважды
    description: Промокод SALE10 уменьшает сумму на 19% вместо 10% в корзинах больше 1000 ₽. Акция идёт сейчас и рекламируется по email.
    severity: Critical
    priority: High
    explain: Прямые финансовые потери на каждом заказе в рамках идущей акции. Обходного пути нет — компания теряет деньги прямо сейчас.
  - title: Пагинация каталога пропускает один товар
    description: При переходе на страницу 2 первый товар второй страницы не показывается — его можно найти только поиском.
    severity: Major
    priority: Medium
    explain: Часть товаров «пропадает» из каталога, продажи этих товаров страдают, но обходной путь (поиск) есть.
  - title: Неверный порядок сортировки «по цене» для товаров с одинаковой ценой
    description: Товары по 299 ₽ при каждой загрузке перемешиваются между собой. Требование про порядок одинаковых цен не описано.
    severity: Trivial
    priority: Low
    explain: Поведение не противоречит требованиям и почти не влияет на пользователя. Можно уточнить у аналитика и оставить в бэклоге.
  - title: Кнопка «Купить» уезжает за край экрана на iPhone SE
    description: На экранах шириной 320 px кнопка «Купить» в карточке товара не видна и недоступна без масштабирования. Доля таких устройств — 4%.
    severity: Major
    priority: Medium
    explain: Для части пользователей покупка из карточки фактически невозможна (есть обходной путь — масштаб или корзина из списка). Важно, но не пожар.
  - title: Утечка email других пользователей в API отзывов
    description: Ответ GET /api/products/5/reviews содержит поле authorEmail с адресами всех авторов. Ответ доступен без авторизации.
    severity: Critical
    priority: High
    explain: Утечка персональных данных — юридический и репутационный риск. Такие баги чинят сразу, независимо от «видимости».
  - title: В футере устаревший год
    description: Внизу сайта написано «© 2023». Сейчас другой год.
    severity: Trivial
    priority: Low
    explain: Косметика без влияния на пользователей. Поправят при случае.
  - title: Не приходит письмо с подтверждением заказа
    description: После оформления заказа письмо не отправляется. Заказ создаётся, статус виден в личном кабинете.
    severity: Major
    priority: High
    explain: Основная функция работает, но пользователи не уверены, что заказ принят, звонят в поддержку, дублируют заказы. Высокий бизнес-импакт.
  - title: Приложение падает при вставке эмодзи в комментарий к заказу
    description: Ввод 🍔 в поле «Комментарий» и отправка заказа приводят к ошибке 500, заказ не создаётся. Без эмодзи всё работает.
    severity: Critical
    priority: Medium
    explain: Заказ не создаётся (серьёзный сбой функции), но сценарий редкий и есть очевидный обходной путь. Часто чинят в ближайшем релизе.
  - title: Неправильная подсказка в поле пароля
    description: Под полем написано «минимум 6 символов», а система требует 8 и выдаёт понятную ошибку при вводе 6–7.
    severity: Minor
    priority: Medium
    explain: Пользователь в итоге регистрируется, но спотыкается. Несоответствие текста и правила — дешёвая правка, её обычно не откладывают надолго.
  - title: Время ответа каталога выросло с 200 мс до 4 секунд
    description: После релиза главная страница каталога загружается 4–5 секунд. Ошибок нет. Конверсия за утро упала на 15%.
    severity: Major
    priority: High
    explain: Функция работает, но медленно — и это уже видно по деньгам (конверсия). Цифры бизнес-метрики поднимают приоритет.
  - title: Невозможно войти никому
    description: После выкатки авторизация возвращает 500 для всех пользователей. Гостевой режим не предусмотрен.
    severity: Blocker
    priority: High
    explain: Весь сервис недоступен для пользователей. Типичный повод для отката релиза.
  - title: Выравнивание иконок в админке съехало на 2 пикселя
    description: В таблице товаров админки иконки «изменить» и «удалить» стоят чуть ниже текста. Админкой пользуются 3 менеджера.
    severity: Trivial
    priority: Low
    explain: Внутренний интерфейс, косметика, никого не блокирует.
  - title: Статус заказа не меняется на READY
    description: Оплаченные заказы навсегда остаются в статусе PAID. Кухня получает заказы по отдельному каналу и готовит их, но клиенты не видят готовность.
    severity: Major
    priority: High
    explain: Ядро процесса (готовка) работает, но клиенты не знают, когда забирать заказ, — поток жалоб и звонков. Чинят срочно.
  - title: Поиск не находит товар при вводе в другой раскладке
    description: Запрос «,ehuth» (бургер в английской раскладке) ничего не находит. Требования такой функции не содержат.
    severity: Minor
    priority: Low
    explain: Это скорее улучшение, чем дефект. Записывают как пожелание.
  - title: Двойное списание при двойном клике на «Оплатить»
    description: Быстрый двойной клик создаёт два платежа на одну сумму. Воспроизводится у ~1% покупателей, деньги возвращаются только через поддержку.
    severity: Critical
    priority: High
    explain: Деньги клиента списываются дважды — финансовая и репутационная проблема, жалобы и возвраты.
  - title: Отчёт XLSX в админке не открывается в старом Excel 2007
    description: Экспорт заказов открывается в современных Excel, LibreOffice и Google Sheets, но не в Excel 2007.
    severity: Minor
    priority: Low
    explain: Устаревшая программа, есть альтернативы. Часто закрывают как «не будем исправлять».
  - title: Тёмная тема — текст ошибки нечитаем
    description: В тёмной теме сообщения об ошибках формы выводятся тёмно-красным на чёрном фоне, их почти не видно.
    severity: Minor
    priority: Medium
    explain: Пользователь может не понять, почему форма не отправляется. Влияние ограничено пользователями тёмной темы.
  - title: Промокод работает после окончания срока действия
    description: Промокод NEWYEAR, действовавший до 10 января, продолжает давать скидку 15%. Его публиковали на купонных сайтах.
    severity: Major
    priority: High
    explain: Прямые потери денег, и промокод широко распространён. Логика функции нарушена — severity высокая, срочность тоже.
  - title: Автотесты на стенде падают из-за неверного сертификата
    description: Стенд stage отдаёт просроченный TLS-сертификат. Продукт на проде не затронут, ручное тестирование идёт с предупреждением браузера.
    severity: Major
    priority: High
    explain: Блокирует проверку релизов (автотесты не идут), хотя пользователи не страдают. Для команды — срочно.
  - title: Неверное склонение в корзине
    description: «В корзине 5 товара» вместо «5 товаров».
    severity: Trivial
    priority: Low
    explain: Текстовая косметика, на покупку не влияет.
  - title: XSS в отзыве о товаре
    description: Отзыв с текстом `<img src=x onerror=alert(1)>` выполняет скрипт у всех, кто открывает карточку товара.
    severity: Critical
    priority: High
    explain: Уязвимость безопасности, позволяющая красть сессии пользователей. Исправляют немедленно.
