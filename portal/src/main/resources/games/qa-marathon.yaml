    - {q: "Что делает @JsonIgnoreProperties(ignoreUnknown = true)?", o: ["Не падать на неизвестных полях JSON", "Игнорировать все поля", "Удалять поля из ответа"], e: "Для контракт-тестов иногда наоборот нужна строгость."}
