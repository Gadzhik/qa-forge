    - {q: "Сколько экземпляров тестового класса создаёт JUnit по умолчанию?", o: ["Новый на каждый тест", "Один на класс", "Один на весь прогон"], e: "Поэтому поля не делят состояние между тестами."}
    - {q: "Зачем @DisplayName?", o: ["Понятное имя теста в отчётах", "Для запуска теста", "Для отключения"], e: "Отчёт должен читаться без кода."}
    - {q: "Как отключить тест с объяснением?", o: ["@Disabled(\"причина\")", "Удалить", "Закомментировать @Test"], e: "Видно в отчёте как skipped."}
    - {q: "Как запустить тест с разными данными?", o: ["@ParameterizedTest + источник (@ValueSource, @CsvSource)", "Скопировать тест", "Цикл внутри теста"], e: "Каждый набор — отдельный тест в отчёте."}
    - {q: "Какой источник берёт данные из метода?", o: ["@MethodSource", "@ValueSource", "@EnumSource"], e: "Метод возвращает Stream<Arguments>."}
    - {q: "Зачем @Nested?", o: ["Группировать тесты во вложенных классах по сценариям", "Запускать параллельно", "Отключать тесты"], e: "Отчёт выглядит как дерево."}
    - {q: "Как запустить только тесты с тегом smoke?", o: ["@Tag(\"smoke\") и -Dgroups=smoke", "@Smoke", "Переименовать класс"], e: "Исключить — -DexcludedGroups."}
    - {q: "Как проверить, что код бросает исключение (AssertJ)?", o: ["assertThatThrownBy(() -> ...).isInstanceOf(...)", "try/catch без проверки", "assertThat(null)"], e: "В JUnit — assertThrows."}
    - {q: "Что делают мягкие проверки (SoftAssertions)?", o: ["Собирают все падения и сообщают их вместе", "Не падают никогда", "Проверяют быстрее"], e: "assertSoftly(s -> {...})."}
    - {q: "Как сравнить BigDecimal 869.7 и 869.70 как равные?", o: ["isEqualByComparingTo", "isEqualTo", "isSameAs"], e: "BigDecimal.equals учитывает масштаб."}
    - {q: "Как проверить список без учёта порядка?", o: ["containsExactlyInAnyOrder", "containsExactly", "isEqualTo"], e: "containsExactly проверяет и порядок."}
    - {q: "Что проверяет extracting в AssertJ?", o: ["Значения поля у всех элементов коллекции", "Длину строки", "Тип исключения"], e: "assertThat(products).extracting(Product::name).contains(\"Кола\")."}
    - {q: "Что такое расширение JUnit 5?", o: ["Класс, подключаемый через @ExtendWith, который встраивается в жизненный цикл тестов", "Новый тип ассерта", "Плагин IDEA"], e: "Пример — ParameterResolver, TestWatcher."}
    - {q: "Зачем ParameterResolver?", o: ["Подставлять объекты в параметры тестового метода", "Генерировать данные", "Запускать тесты"], e: "Например, @NewUser User user."}
    - {q: "Как перемешать порядок тестов, чтобы найти зависимости?", o: ["@TestMethodOrder(MethodOrderer.Random.class)", "@Order(1)", "Переименовать методы"], e: "Хорошие тесты проходят в любом порядке."}
    - {q: "Как повторить тест 20 раз?", o: ["@RepeatedTest(20)", "@Test(20)", "@Loop(20)"], e: "Полезно для поиска нестабильности."}
    - {q: "Что такое TDD?", o: ["Сначала пишем тест, потом код, который его проходит", "Тестирование после релиза", "Ручное тестирование"], e: "Красный → зелёный → рефакторинг."}
    - {q: "Как в TestNG задают данные для параметризованного теста?", o: ["@DataProvider", "@CsvSource", "@ValueSource"], e: "В JUnit — @ParameterizedTest с источниками."}
    - {q: "Что сделает тест без ни одной проверки, если код не бросает исключений?", o: ["Пройдёт — даже если результат неверный", "Упадёт", "Будет пропущен"], e: "Тест без проверок бесполезен."}
    - {q: "Как убедиться, что автотест действительно ловит баг?", o: ["Внести дефект и увидеть, что тест падает", "Запустить его ещё раз", "Посмотреть на зелёный цвет"], e: "Это идея Test Lab и мутационного тестирования."}
  "HTTP и API":
