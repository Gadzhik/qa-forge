    - {q: "Чем отличаются i++ и ++i?", o: ["i++ возвращает старое значение, ++i — новое", "Ничем", "++i работает только в циклах"], e: "Оба увеличивают i на 1, разница — в возвращаемом значении."}
    - {q: "Почему String неизменяемый?", o: ["Любая модификация создаёт новую строку — это безопасно и позволяет пул строк", "Это ошибка Java", "Он изменяемый"], e: "Для склейки в цикле — StringBuilder."}
