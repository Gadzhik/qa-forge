    - {q: "Модификатор private означает доступ...", o: ["Только внутри класса", "Внутри пакета", "Везде"], e: "Без модификатора — доступ в пределах пакета."}
    - {q: "Что нужно переопределить вместе с equals?", o: ["hashCode", "toString", "clone"], e: "Иначе объекты ведут себя неправильно в HashMap и HashSet."}
    - {q: "Что даёт record?", o: ["Неизменяемый класс данных с конструктором, геттерами, equals, hashCode, toString", "Изменяемый класс", "Интерфейс"], e: "Идеально для моделей ответов API."}
