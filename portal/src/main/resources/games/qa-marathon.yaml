    - {q: "Что значит regex \\d+?", o: ["Одна или более цифр", "Ровно одна цифра", "Ноль цифр"], e: "+ — один или больше, * — ноль или больше."}
    - {q: "Что такое состояние гонки (race condition)?", o: ["Результат зависит от порядка выполнения потоков", "Быстрый код", "Ошибка компиляции"], e: "Пример: count++ из нескольких потоков теряет увеличения."}
    - {q: "Как сделать счётчик потокобезопасным?", o: ["AtomicInteger", "Обычный int", "static int"], e: "Или synchronized."}
