    - {q: "Зачем @Builder?", o: ["Удобно создавать объект с нужными полями по цепочке", "Для сборки проекта", "Для запуска тестов"], e: "Product.builder().name(\"Кола\").price(...).build()."}
    - {q: "Что делает Jackson?", o: ["Превращает JSON в Java-объекты и обратно", "Запускает тесты", "Делает HTTP-запросы"], e: "Сериализация и десериализация."}
