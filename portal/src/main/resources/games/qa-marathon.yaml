    - {q: "Какой класс для даты без времени?", o: ["LocalDate", "Date", "Instant"], e: "Instant — момент времени в UTC, LocalDateTime — дата и время без зоны."}
    - {q: "Как прочитать файл целиком в строку?", o: ["Files.readString(path)", "new File(path).text()", "System.read(path)"], e: "Пути — через Path.of, чтобы работало на всех ОС."}
