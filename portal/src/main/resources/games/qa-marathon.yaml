  "JUnit 5 и AssertJ":
    - {q: "Какая аннотация помечает тестовый метод в JUnit 5?", o: ["@Test", "@Run", "@Check"], e: "Импорт org.junit.jupiter.api.Test."}
    - {q: "Что выполняется перед каждым тестом?", o: ["@BeforeEach", "@BeforeAll", "@AfterEach"], e: "@BeforeAll — один раз на класс и должен быть static."}
