  "REST Assured":
    - {q: "Как устроен тест REST Assured?", o: ["given() — запрос, when() — действие, then() — проверки", "start() — run() — stop()", "open() — click() — check()"], e: "Стиль BDD."}
    - {q: "Как проверить код ответа?", o: ["then().statusCode(200)", "then().code(200)", "assert(200)"], e: "Проверка падает с понятным сообщением."}
    - {q: "Как проверить поле JSON-ответа?", o: ["body(\"name\", equalTo(\"Кола\"))", "json(\"name\") == \"Кола\"", "check(name)"], e: "Путь пишется в синтаксисе GPath."}
    - {q: "Как извлечь значение из ответа?", o: ["extract().path(\"id\")", "get(\"id\")", "response.id"], e: "Или extract().as(Product.class)."}
    - {q: "Как превратить ответ в объект модели?", o: ["extract().as(Product.class)", "toObject()", "parse()"], e: "Под капотом — Jackson."}
    - {q: "Как отправить объект в теле запроса?", o: ["body(request) с Content-Type JSON", "param(request)", "header(request)"], e: "REST Assured сериализует объект Jackson'ом."}
    - {q: "Зачем RequestSpecification?", o: ["Общие настройки запросов в одном месте", "Для проверок ответа", "Для запуска сервера"], e: "baseUri, Content-Type, авторизация, фильтры."}
    - {q: "Как передать query-параметр?", o: ["queryParam(\"page\", 1)", "header(\"page\", 1)", "body(\"page=1\")"], e: "pathParam — для {id} в пути."}
    - {q: "Как логировать запрос и ответ только при падении?", o: ["log().ifValidationFails()", "log().all() всегда", "System.out.println"], e: "Меньше шума в логах."}
    - {q: "Как проверить ответ по JSON Schema?", o: ["body(matchesJsonSchemaInClasspath(\"product.json\"))", "schema(true)", "validate()"], e: "Модуль json-schema-validator."}
