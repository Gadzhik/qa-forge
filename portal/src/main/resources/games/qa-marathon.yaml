    - {q: "Что такое перегрузка метода?", o: ["Несколько методов с одним именем и разными параметрами", "Метод, который вызывается слишком часто", "Замена метода родителя"], e: "Замена метода родителя — переопределение (override)."}
    - {q: "Что такое класс?", o: ["Шаблон, описывающий данные и поведение объектов", "Переменная", "Файл настроек"], e: "Объект — экземпляр класса."}
    - {q: "Зачем нужен конструктор?", o: ["Для создания и инициализации объекта", "Для удаления объекта", "Для вывода на экран"], e: "Вызывается при new."}
    - {q: "Что такое инкапсуляция?", o: ["Скрытие данных за методами (private поля + публичные методы)", "Наследование", "Перегрузка"], e: "Объект сам следит за корректностью своих данных."}
    - {q: "Какое ключевое слово используют для наследования класса?", o: ["extends", "implements", "inherits"], e: "implements — для реализации интерфейса."}
    - {q: "Сколько классов можно унаследовать в Java?", o: ["Один", "Сколько угодно", "Два"], e: "А интерфейсов можно реализовать много."}
    - {q: "Что такое полиморфизм?", o: ["Вызов метода фактического объекта через ссылку на общий тип", "Множество конструкторов", "Скрытие полей"], e: "List<Discount> со скидками разных классов — пример."}
    - {q: "Что означает static у поля?", o: ["Поле принадлежит классу, а не объекту", "Поле нельзя изменить", "Поле приватное"], e: "Нельзя изменить — это final."}
