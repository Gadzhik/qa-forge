# QA Marathon: банк вопросов. В «o» первый вариант — правильный (в игре варианты перемешиваются).
# «e» — короткое объяснение после ответа. Строки — в двойных кавычках, внутри используйте «ёлочки».
topics:
  "Теория тестирования":
    - {q: "Что показывает тестирование?", o: ["Наличие дефектов, но не их отсутствие", "Что дефектов нет", "Скорость разработчиков"], e: "Первый принцип тестирования: можно доказать наличие ошибок, но не их отсутствие."}
    - {q: "Почему исчерпывающее тестирование невозможно?", o: ["Комбинаций входов и состояний практически бесконечно много", "Это запрещено стандартами", "Тестировщиков мало"], e: "Поэтому применяют техники тест-дизайна и оценку рисков."}
    - {q: "Что такое парадокс пестицида?", o: ["Одни и те же тесты со временем перестают находить новые дефекты", "Тесты ломают продукт", "Баги размножаются"], e: "Тесты нужно пересматривать и дополнять."}
    - {q: "Чем QA отличается от тестирования?", o: ["QA — процессы предотвращения дефектов, тестирование — их поиск", "Ничем", "QA — только автотесты"], e: "Тестирование — часть контроля качества, а QA охватывает весь процесс разработки."}
    - {q: "Что такое верификация?", o: ["Проверка соответствия спецификации", "Проверка соответствия ожиданиям пользователя", "Проверка скорости"], e: "Верификация: «делаем продукт правильно?». Валидация: «делаем правильный продукт?»."}
    - {q: "Что такое валидация?", o: ["Проверка, что продукт решает задачу пользователя", "Проверка синтаксиса кода", "Проверка формы ввода"], e: "Продукт может соответствовать ТЗ, но не нужен пользователю — это провал валидации."}
    - {q: "Какой уровень тестирования проверяет отдельную функцию или класс?", o: ["Модульный (unit)", "Системный", "Приёмочный"], e: "Unit-тесты пишут чаще всего разработчики."}
    - {q: "Что проверяет интеграционное тестирование?", o: ["Взаимодействие компонентов или сервисов", "Один метод", "Удобство интерфейса"], e: "Например, сервис заказов правильно вызывает платёжный."}
    - {q: "Что изображает пирамида тестирования?", o: ["Много быстрых unit-тестов, меньше API, мало UI", "Много UI, мало unit", "Равное число тестов на всех уровнях"], e: "Наверху — медленные и хрупкие E2E/UI тесты, их должно быть меньше всего."}
    - {q: "Smoke-тестирование — это...", o: ["Быстрая проверка, что основное работает и сборку можно тестировать", "Полный регресс", "Нагрузочный тест"], e: "Smoke запускают первым на каждой новой сборке."}
    - {q: "Регрессионное тестирование проверяет...", o: ["Что изменения не сломали работавшее раньше", "Только новую функцию", "Производительность"], e: "Основной кандидат на автоматизацию."}
    - {q: "Какой вид тестирования нефункциональный?", o: ["Нагрузочное", "Проверка оформления заказа", "Проверка расчёта скидки"], e: "Нефункциональные: производительность, безопасность, удобство, совместимость."}
    - {q: "Что такое классы эквивалентности?", o: ["Группы входных данных, которые система обрабатывает одинаково", "Классы Java с одинаковыми полями", "Одинаковые тест-кейсы"], e: "Из каждого класса достаточно одного представителя."}
    - {q: "Поле принимает возраст 18–65. Какие значения дают граничные значения?", o: ["17, 18, 65, 66", "18 и 65", "0 и 100"], e: "Проверяем каждую границу и ближайшее значение за ней."}
    - {q: "Когда полезна таблица решений?", o: ["Когда результат зависит от комбинации нескольких условий", "Для одного поля ввода", "Для проверки цвета кнопки"], e: "Например, скидка зависит от суммы, промокода и статуса клиента."}
    - {q: "Попарное тестирование (pairwise) — это...", o: ["Покрытие всех пар значений параметров меньшим числом тестов", "Тестирование вдвоём", "Сравнение двух версий"], e: "Большинство дефектов вызывает комбинация двух параметров."}
    - {q: "Что моделирует диаграмма состояний и переходов?", o: ["Статусы объекта и допустимые переходы между ними", "Структуру БД", "Иерархию классов"], e: "Например, NEW → PAID → READY; проверяют и недопустимые переходы."}
    - {q: "Что такое тест-кейс?", o: ["Шаги, данные и ожидаемый результат для проверки", "Список идей без деталей", "Отчёт о баге"], e: "Тест-кейс воспроизводим любым человеком."}
    - {q: "Чем чек-лист отличается от тест-кейса?", o: ["Это список проверок без подробных шагов", "Он длиннее", "Это то же самое"], e: "Чек-листы быстрее писать и поддерживать."}
    - {q: "Что обязательно в баг-репорте?", o: ["Шаги, фактический и ожидаемый результат, окружение", "Только скриншот", "Имя разработчика"], e: "Хороший баг-репорт воспроизводится без вопросов."}
    - {q: "Severity описывает...", o: ["Насколько дефект влияет на работу системы", "Как срочно его чинить", "Кто его нашёл"], e: "Срочность — это priority."}
    - {q: "Priority описывает...", o: ["Насколько срочно нужно исправить", "Техническое влияние", "Сложность исправления"], e: "Priority определяется бизнесом."}
    - {q: "Опечатка в названии бренда на главной — это обычно...", o: ["Низкая severity, высокий priority", "Высокая severity, низкий priority", "Blocker"], e: "Влияние на работу минимальное, но это видят все."}
    - {q: "Какой статус ставят багу, который не удалось воспроизвести?", o: ["Cannot reproduce", "Fixed", "Duplicate"], e: "Обычно с просьбой дополнить шаги и окружение."}
    - {q: "Что такое исследовательское тестирование?", o: ["Одновременное изучение продукта, проектирование и выполнение проверок", "Тестирование без цели", "Только автотесты"], e: "Хорошо работает с ограничением по времени и целью (чартером)."}
    - {q: "Черный ящик — это тестирование...", o: ["Без знания внутреннего устройства, по требованиям", "Только с исходным кодом", "В тёмной комнате"], e: "Белый ящик — с знанием кода, серый — частично."}
    - {q: "Что такое Definition of Done?", o: ["Критерии, при которых задача считается завершённой", "Дата релиза", "Список багов"], e: "Например: код прошёл ревью, тесты написаны и зелёные."}
    - {q: "Что значит shift-left?", o: ["Начинать тестирование как можно раньше в процессе разработки", "Сдвигать релиз", "Писать тесты после релиза"], e: "Ошибка в требованиях дешевле всего на этапе требований."}
    - {q: "Что такое тестовое покрытие требований?", o: ["Доля требований, для которых есть проверки", "Количество строк кода", "Число тестировщиков"], e: "Отслеживается матрицей трассируемости."}
    - {q: "Альфа-тестирование проводят...", o: ["Внутри компании до выпуска пользователям", "Реальные пользователи после релиза", "Только разработчики в IDE"], e: "Бета — ограниченный круг реальных пользователей."}
    - {q: "Что такое тестовый оракул?", o: ["Источник ожидаемого результата", "Тестовый сервер", "Автор теста"], e: "Требования, спецификация, предыдущая версия, здравый смысл."}
    - {q: "Где дефект найти и исправить дешевле всего?", o: ["На этапе требований", "В продакшене", "При приёмке"], e: "Стоимость исправления растёт с каждым этапом."}
  "Git и инструменты":
    - {q: "Что делает git commit?", o: ["Сохраняет снимок проиндексированных изменений в истории", "Отправляет на сервер", "Скачивает изменения"], e: "Отправка — git push."}
    - {q: "Что делает git add?", o: ["Добавляет изменения в индекс для следующего коммита", "Создаёт файл", "Создаёт ветку"], e: "Индекс (staging area) — то, что попадёт в коммит."}
    - {q: "Как создать ветку и сразу переключиться на неё?", o: ["git switch -c feature", "git branch -d feature", "git push feature"], e: "Или git checkout -b feature."}
    - {q: "Что делает git pull?", o: ["Скачивает изменения с сервера и вливает их в текущую ветку", "Отправляет коммиты", "Удаляет ветку"], e: "Фактически это fetch + merge (или rebase)."}
    - {q: "Когда возникает конфликт слияния?", o: ["Когда в обеих ветках изменили одни и те же строки", "Всегда при merge", "При пустом коммите"], e: "Конфликт решают вручную и делают коммит."}
    - {q: "Зачем нужен .gitignore?", o: ["Чтобы git не отслеживал служебные файлы (target, .idea)", "Чтобы скрыть репозиторий", "Чтобы удалить файлы"], e: "Сборочные артефакты и секреты в репозиторий не кладут."}
    - {q: "Что такое Pull Request / Merge Request?", o: ["Запрос на слияние ветки с ревью кода", "Скачивание репозитория", "Откат коммита"], e: "В PR обычно запускаются автотесты в CI."}
    - {q: "Как посмотреть историю коммитов кратко?", o: ["git log --oneline", "git status", "git diff --cached"], e: "git status показывает текущее состояние рабочих файлов."}
    - {q: "Зачем SSH-ключ для GitHub/GitLab?", o: ["Для аутентификации без ввода пароля", "Для шифрования кода", "Для ускорения push"], e: "Публичная часть ключа добавляется в профиль."}
    - {q: "В DevTools на какой вкладке видно HTTP-запросы страницы?", o: ["Network", "Elements", "Sources"], e: "Там же статус, заголовки, тело ответа и время."}
    - {q: "Как в DevTools проверить CSS-селектор?", o: ["Во вкладке Elements нажать Ctrl+F и ввести селектор", "Перезагрузить страницу", "Во вкладке Application"], e: "Поиск понимает CSS и XPath и показывает число совпадений."}
    - {q: "Что делает git stash?", o: ["Временно откладывает незакоммиченные изменения", "Удаляет ветку", "Отправляет изменения"], e: "Вернуть — git stash pop."}
    - {q: "Что хранит вкладка Application в DevTools?", o: ["Cookies, localStorage, sessionStorage", "Только картинки", "Исходный код сервера"], e: "Полезно для авторизации в UI-тестах через cookie."}
    - {q: "Какая клавиша в IDEA запускает поиск везде?", o: ["Двойной Shift", "F1", "Ctrl+Z"], e: "Search Everywhere ищет классы, файлы, действия."}
    - {q: "Что делает точка останова (breakpoint) в отладчике?", o: ["Останавливает программу на строке, чтобы посмотреть значения переменных", "Удаляет строку", "Ускоряет программу"], e: "Затем можно шагать по коду: Step Over, Step Into."}
  "Java: основы и ООП":
